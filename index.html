<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karima Couture</title>

<style>

body{
font-family:Arial;
background:#f7f7f7;
margin:0;
}

header{
background:#111;
color:white;
text-align:center;
padding:25px;
}

nav{
background:white;
padding:15px;
text-align:center;
}

nav a{
margin:10px;
text-decoration:none;
color:#111;
}

.products{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

.product{
background:white;
width:280px;
padding:15px;
border-radius:10px;
text-align:center;
}

.product img{
width:100%;
border-radius:10px;
}

select,input,button{
width:90%;
padding:12px;
margin:8px;
}

button{
background:#111;
color:white;
border:0;
cursor:pointer;
border-radius:5px;
}

.order{
background:white;
margin:20px auto;
padding:20px;
max-width:500px;
border-radius:10px;
}

</style>

</head>


<body>


<header>

<h1>Karima Couture 👗</h1>

<p>أناقة المرأة الجزائرية 🇩🇿</p>

</header>


<nav>

<a href="#">الرئيسية</a>
<a href="#">فساتين</a>
<a href="#">قنادر</a>

</nav>



<section class="products">


<div class="product">

<img src="images/dress1.jpg.jpg">

<h2>قندورة أنيقة</h2>

<p>السعر: 3500 دج</p>


<select>
<option>المقاس 46</option>
<option>المقاس 48</option>
<option>المقاس 50</option>
<option>المقاس 52</option>
</select>


<p>اللون: حسب الصورة</p>


<button onclick="selectProduct('قندورة أنيقة','3500')">
اطلب الآن
</button>

</div>



<div class="product">

<img src="images/dress2.jpg.jpg">

<h2>قندورة فاخرة</h2>

<p>السعر: 4500 دج</p>


<select>
<option>المقاس 46</option>
<option>المقاس 48</option>
<option>المقاس 50</option>
<option>المقاس 52</option>
</select>


<p>اللون: حسب الصورة</p>


<button onclick="selectProduct('قندورة فاخرة','4500')">
اطلب الآن
</button>

</div>



<div class="product">

<img src="images/dress3.jpg.jpg">

<h2>فستان نسائي</h2>

<p>السعر: 3500 دج</p>


<select>
<option>المقاس 46</option>
<option>المقاس 48</option>
<option>المقاس 50</option>
<option>المقاس 52</option>
</select>


<p>اللون: حسب الصورة</p>


<button onclick="selectProduct('فستان نسائي','3500')">
اطلب الآن
</button>

</div>



</section>




<section class="order">


<h2>طلب الشراء</h2>


<input id="name" placeholder="الاسم واللقب">


<input id="phone" placeholder="رقم الهاتف">


<input id="product" placeholder="المنتج">


<input id="price" placeholder="السعر">



<button onclick="sendOrder()">

إرسال الطلب

</button>


</section>




<footer>

<p>© 2026 Karima Couture - الجزائر</p>

</footer>



<script>


function selectProduct(name,price){

document.getElementById("product").value=name;

document.getElementById("price").value=price+" دج";

}



function sendOrder(){


let name=document.getElementById("name").value;

let phone=document.getElementById("phone").value;

let product=document.getElementById("product").value;

let price=document.getElementById("price").value;



alert(
"الاسم: "+name+
"\nالهاتف: "+phone+
"\nالمنتج: "+product+
"\nالسعر: "+price
);


}


</script>


</body>

</html>
