<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Karima Couture - طلب شراء</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.box{
background:white;
max-width:500px;
margin:auto;
padding:20px;
border-radius:10px;
}

input,select,button{
width:100%;
padding:12px;
margin:8px 0;
}

button{
background:#000;
color:white;
border:none;
cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>Karima Couture 👗</h2>
<h3>طلب الشراء</h3>

<input placeholder="الاسم واللقب">

<input placeholder="رقم الهاتف">

<label>الولاية</label>
<select id="wilaya" onchange="loadCommunes()">
<option value="">اختر الولاية</option>
</select>


<label>البلدية</label>
<select id="commune">
<option>اختر البلدية</option>
</select>


<label>المنتج</label>
<select>
<option>اختر المنتج</option>
<option>فستان نسائي</option>
<option>قندورة</option>
</select>


<label>المقاس</label>
<select>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>


<label>اللون</label>
<select>
<option>أسود</option>
<option>أبيض</option>
<option>بيج</option>
<option>أحمر</option>
</select>


<button>
إرسال الطلب
</button>


</div>


<script>

const data = {

"أم البواقي":[
"أم البواقي",
"عين البيضاء",
"عين مليلة",
"عين فكرون",
"مسكيانة"
],

"قسنطينة":[
"قسنطينة",
"الخروب",
"عين سمارة",
"حامة بوزيان"
],

"باتنة":[
"باتنة",
"بريكة",
"آريس",
"مروانة"
],

"الجزائر":[
"الجزائر الوسطى",
"باب الوادي",
"الحراش",
"الدار البيضاء"
],

"وهران":[
"وهران",
"السانية",
"أرزيو",
"بطيوة"
]

};


let wilaya=document.getElementById("wilaya");


for(let w in data){

let option=document.createElement("option");
option.text=w;
option.value=w;
wilaya.add(option);

}



function loadCommunes(){

let w=wilaya.value;

let commune=document.getElementById("commune");

commune.innerHTML="";


data[w].forEach(function(c){

let option=document.createElement("option");
option.text=c;
option.value=c;
commune.add(option);

});

}


</script>


</body>
</html>
