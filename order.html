<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Karima Couture - طلب شراء</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}
.box{
background:white;
max-width:500px;
margin:auto;
padding:20px;
border-radius:10px;
}
input,select,button{
width:100%;
padding:12px;
margin:8px 0;
}
button{
background:black;
color:white;
border:0;
}
</style>

</head>

<body>

<div class="box">

<h2>Karima Couture 👗</h2>
<h3>طلب الشراء</h3>

<input placeholder="الاسم واللقب">

<input placeholder="رقم الهاتف">

<select id="wilaya" onchange="changeCommune()">
<option>اختر الولاية</option>
<option>أم البواقي</option>
<option>قسنطينة</option>
<option>باتنة</option>
<option>الجزائر</option>
<option>وهران</option>
</select>

<select id="commune">
<option>اختر البلدية</option>
</select>

<select>
<option>اختر المنتج</option>
<option>فستان نسائي</option>
<option>قندورة</option>
</select>

<select>
<option>المقاس</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<select>
<option>اللون</option>
<option>أسود</option>
<option>أبيض</option>
<option>بيج</option>
</select>

<button>إرسال الطلب</button>

</div>


<script>

function changeCommune(){<script>

let communes = {};

fetch("algeria.json")
.then(response => response.json())
.then(data => {
    communes = data;
});


function changeCommune(){

let wilaya = document.getElementById("wilaya").value;
let commune = document.getElementById("commune");

commune.innerHTML = "";

if(communes[wilaya]){

communes[wilaya].forEach(function(city){

let option = document.createElement("option");
option.text = city;
option.value = city;
commune.add(option);

});

}else{

commune.innerHTML="<option>اختر البلدية</option>";

}

}

</script>
